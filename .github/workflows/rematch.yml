# Daily auto rematch for places with source null|kakao.
# Uses production POST /api/admin/rematch via scripts/rematch-runner.mjs
#
# Secrets required:
#   REMATCH_SECRET  — must match Railway REMATCH_SECRET
#   APP_URL         — e.g. https://pindmap.com  (no trailing slash)
#
# Note: GitHub may delay or skip schedules on inactive repos; workflow_dispatch always works.

name: daily-rematch

on:
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = KST 04:00
  workflow_dispatch:

jobs:
  rematch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run rematch batches
        env:
          REMATCH_SECRET: ${{ secrets.REMATCH_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          BATCH_SIZE: "150"
        run: node scripts/rematch-runner.mjs
