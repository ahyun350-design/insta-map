# Daily auto rematch for places with source null|kakao.
# Uses production POST /api/admin/rematch (same poiMatch rules as the app).
#
# Secrets required:
#   REMATCH_SECRET  — must match Railway REMATCH_SECRET
#   APP_URL         — e.g. https://pindmap.com  (no trailing slash)
#
# Note: GitHub may delay or skip schedules on inactive repos; workflow_dispatch always works.

name: daily-rematch

on:
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = KST 04:00
  workflow_dispatch:

jobs:
  rematch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Run rematch batches
        env:
          REMATCH_SECRET: ${{ secrets.REMATCH_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "${REMATCH_SECRET:-}" ]; then
            echo "REMATCH_SECRET secret is missing"
            exit 1
          fi
          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL secret is missing"
            exit 1
          fi

          BASE="${APP_URL%/}"
          BATCH_SIZE=150
          MAX_BATCHES=130
          # Fresh every Actions run — never resume a prior day's cursor.
          # Within this run only: advance cursor across batches (kakao → null).
          CURSOR=""
          TOTAL_PROCESSED=0
          TOTAL_MATCHED=0
          echo "=== run start: no cursor (kakao-first), batchSize=${BATCH_SIZE}, maxBatches=${MAX_BATCHES} ==="

          for i in $(seq 1 "$MAX_BATCHES"); do
            echo "=== batch $i ==="
            BODY=$(jq -cn --argjson bs "$BATCH_SIZE" '{batchSize:$bs}')
            if [ -n "$CURSOR" ]; then
              BODY=$(jq -cn --arg c "$CURSOR" --argjson bs "$BATCH_SIZE" '{cursor:$c,batchSize:$bs}')
            fi

            HTTP_CODE=""
            ATTEMPT=0
            MAX_ATTEMPTS=3
            while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
              ATTEMPT=$((ATTEMPT + 1))
              # Do not append `|| echo 000` — curl already writes 000 on transport
              # failure; appending would yield "000000" and skip the retry case.
              set +e
              HTTP_CODE=$(curl -sS -o /tmp/rematch.json -w "%{http_code}" \
                -X POST "$BASE/api/admin/rematch" \
                -H "Authorization: Bearer ${REMATCH_SECRET}" \
                -H "Content-Type: application/json" \
                -d "$BODY")
              CURL_RC=$?
              set -e
              if [ "$CURL_RC" -ne 0 ] || [ -z "$HTTP_CODE" ]; then
                HTTP_CODE="000"
              fi

              echo "attempt=$ATTEMPT http=$HTTP_CODE"
              if [ -f /tmp/rematch.json ]; then
                cat /tmp/rematch.json
                echo
              fi

              # Success
              if [ "$HTTP_CODE" = "200" ]; then
                break
              fi

              # 5xx / network → retry same cursor (up to 2 retries = 3 attempts)
              case "$HTTP_CODE" in
                5??|000|000*)
                  if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                    echo "5xx/network failure — wait 30s then retry same cursor (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
                    sleep 30
                    continue
                  fi
                  ;;
              esac

              echo "rematch batch failed with HTTP $HTTP_CODE after $ATTEMPT attempt(s)"
              exit 1
            done

            if [ "$HTTP_CODE" != "200" ]; then
              echo "rematch batch failed with HTTP $HTTP_CODE after $MAX_ATTEMPTS attempts"
              exit 1
            fi

            PROCESSED=$(jq -r '.processed // 0' /tmp/rematch.json)
            MATCHED=$(jq -r '.matched // 0' /tmp/rematch.json)
            DONE=$(jq -r '.done // false' /tmp/rematch.json)
            CURSOR=$(jq -r '.nextCursor // empty' /tmp/rematch.json)

            TOTAL_PROCESSED=$((TOTAL_PROCESSED + PROCESSED))
            TOTAL_MATCHED=$((TOTAL_MATCHED + MATCHED))

            echo "batch processed=$PROCESSED matched=$MATCHED done=$DONE"

            if [ "$DONE" = "true" ]; then
              echo "finished (done=true): total_processed=$TOTAL_PROCESSED total_matched=$TOTAL_MATCHED"
              exit 0
            fi
            if [ -z "$CURSOR" ]; then
              echo "finished (no nextCursor): total_processed=$TOTAL_PROCESSED total_matched=$TOTAL_MATCHED"
              exit 0
            fi
          done

          echo "stopped after ${MAX_BATCHES} batches (cap ~$((BATCH_SIZE * MAX_BATCHES)) rows): total_processed=$TOTAL_PROCESSED total_matched=$TOTAL_MATCHED"
          exit 0
