# Daily auto rematch for places with source null|kakao.
# Default (schedule + dispatch): only places created in the last 7 days.
# Full scan: workflow_dispatch with input full=true (after loading new POI data).
#
# Secrets required:
#   REMATCH_SECRET  — must match Railway REMATCH_SECRET
#   APP_URL         — e.g. https://pindmap.com  (no trailing slash)
#
# Note: GitHub may delay or skip schedules on inactive repos; workflow_dispatch always works.

name: daily-rematch

on:
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = KST 04:00
  workflow_dispatch:
    inputs:
      full:
        description: "Scan all source null|kakao places (ignore 7-day window)"
        type: boolean
        default: false

jobs:
  rematch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run rematch batches
        env:
          REMATCH_SECRET: ${{ secrets.REMATCH_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          BATCH_SIZE: "150"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            echo "scope=full"
            node scripts/rematch-runner.mjs --full
          else
            echo "scope=sinceDays=7"
            node scripts/rematch-runner.mjs
          fi
