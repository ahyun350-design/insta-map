# Build South Korea OpenMapTiles PMTiles → Supabase Storage (S3 API, multipart).
#
# Required Actions secrets (never log values):
#   SUPABASE_S3_ENDPOINT          — Storage S3 endpoint URL
#   SUPABASE_S3_REGION            — Storage S3 region
#   SUPABASE_S3_ACCESS_KEY_ID     — S3 access key id
#   SUPABASE_S3_SECRET_ACCESS_KEY — S3 secret access key
# Optional:
#   SUPABASE_MAP_TILES_BUCKET     — default map-tiles
#
# Do NOT use SUPABASE_SERVICE_ROLE_KEY here.
# Bucket must be public; global + bucket file size limits must allow ~1–2 GiB.
#
# Modes (workflow_dispatch):
#   default              — full Planetiler + places-extra + upload
#   only_places_extra    — PBF + places-extra only (skip Planetiler / korea.pmtiles upload)
#   upload_only          — download korea-pmtiles artifact and upload (needs artifact_run_id)

name: build-korea-tiles

on:
  workflow_dispatch:
    inputs:
      only_places_extra:
        description: "Build+upload korea-places-extra.pmtiles only (skip Planetiler / korea.pmtiles)"
        type: boolean
        default: false
      upload_only:
        description: "Skip build; download korea-pmtiles artifact and upload to Storage only"
        type: boolean
        default: false
      artifact_run_id:
        description: "Workflow run id that has the korea-pmtiles artifact (required when upload_only)"
        type: string
        required: false
        default: ""
  schedule:
    # 1st of each month, 15:00 UTC ≈ 00:00 KST next day
    - cron: "0 15 1 * *"

permissions:
  contents: read
  actions: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PLANETILER_JAR_URL: "https://github.com/openmaptiles/planetiler-openmaptiles/releases/download/v3.16/planetiler-openmaptiles.jar"
      GEOFABRIK_URL: "https://download.geofabrik.de/asia/south-korea-latest.osm.pbf"
      # Absolute under workspace (set after checkout via GITHUB_ENV too)
      OUT_DIR: ${{ github.workspace }}/build/tiles
      AWS_MAX_ATTEMPTS: "10"
      AWS_RETRY_MODE: adaptive
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      UPLOAD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_only }}
      ONLY_PLACES_EXTRA: ${{ github.event_name == 'workflow_dispatch' && inputs.only_places_extra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets (presence only)
        run: |
          set -euo pipefail
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION SUPABASE_S3_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret mapped to env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add SUPABASE_S3_ENDPOINT, SUPABASE_S3_REGION, SUPABASE_S3_ACCESS_KEY_ID, SUPABASE_S3_SECRET_ACCESS_KEY."
            exit 1
          fi
          echo "Required S3 secrets are set (values not printed)."
          echo "OUT_DIR=$OUT_DIR"
          echo "workspace=${{ github.workspace }}"

      - name: Resolve bucket name
        env:
          BUCKET_SECRET: ${{ secrets.SUPABASE_MAP_TILES_BUCKET }}
        run: |
          if [ -n "$BUCKET_SECRET" ]; then
            echo "BUCKET=$BUCKET_SECRET" >> "$GITHUB_ENV"
          else
            echo "BUCKET=map-tiles" >> "$GITHUB_ENV"
          fi
          echo "Using configured bucket name (not printing secret overrides)."

      - name: Validate dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          if [ "${UPLOAD_ONLY}" = "true" ] && [ "${ONLY_PLACES_EXTRA}" = "true" ]; then
            echo "upload_only and only_places_extra are mutually exclusive."
            exit 1
          fi
          if [ "${UPLOAD_ONLY}" = "true" ] && [ -z "${ARTIFACT_RUN_ID}" ]; then
            echo "upload_only=true requires artifact_run_id (Actions run that has korea-pmtiles artifact)."
            exit 1
          fi
          if [ "${UPLOAD_ONLY}" = "true" ]; then
            echo "Mode: upload_only (artifact id length=${#ARTIFACT_RUN_ID})."
          elif [ "${ONLY_PLACES_EXTRA}" = "true" ]; then
            echo "Mode: only_places_extra (skip Planetiler / korea.pmtiles upload)."
          else
            echo "Mode: full build_and_upload."
          fi

      - name: Configure AWS CLI multipart defaults
        run: |
          set -euo pipefail
          # Smaller parts + low concurrency reduce 524 timeouts on Storage
          aws configure set default.s3.multipart_threshold 16MB
          aws configure set default.s3.multipart_chunksize 16MB
          aws configure set default.s3.max_concurrent_requests 2
          echo "AWS CLI multipart threshold 16MB, chunk 16MB, concurrent 2, retry adaptive."

      - name: Download Geofabrik South Korea PBF
        if: ${{ env.UPLOAD_ONLY != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          echo "Downloading Geofabrik south-korea-latest.osm.pbf"
          curl -L --fail --retry 3 --retry-delay 10 -o "$OUT_DIR/south-korea-latest.osm.pbf" "$GEOFABRIK_URL"
          ls -lh "$OUT_DIR/south-korea-latest.osm.pbf"

      - name: Install osmium + tippecanoe (places-extra)
        if: ${{ env.UPLOAD_ONLY != 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool build-essential libsqlite3-dev zlib1g-dev
          TIPPE_VER=2.53.0
          curl -L --fail -o /tmp/tippecanoe.tgz \
            "https://github.com/felt/tippecanoe/archive/refs/tags/${TIPPE_VER}.tar.gz"
          tar -xzf /tmp/tippecanoe.tgz -C /tmp
          make -C "/tmp/tippecanoe-${TIPPE_VER}" -j"$(nproc)"
          sudo make -C "/tmp/tippecanoe-${TIPPE_VER}" install
          osmium --version | head -1
          tippecanoe -v

      - name: Build korea-places-extra.pmtiles
        if: ${{ env.UPLOAD_ONLY != 'true' }}
        id: places_extra
        run: |
          set -euo pipefail
          SCRIPT="${{ github.workspace }}/scripts/build-korea-places-extra.sh"
          LANDMARKS="${{ github.workspace }}/public/map/korea-landmarks.geojson"
          if [ ! -f "$SCRIPT" ]; then
            echo "Missing $SCRIPT (checkout required)."
            ls -la "${{ github.workspace }}/scripts" || true
            exit 1
          fi
          if [ ! -f "$LANDMARKS" ]; then
            echo "Missing landmarks GeoJSON: $LANDMARKS"
            exit 1
          fi
          chmod +x "$SCRIPT"
          OUT_DIR="$OUT_DIR" LANDMARKS="$LANDMARKS" "$SCRIPT" "$OUT_DIR/south-korea-latest.osm.pbf"
          PLACES_BYTES=$(stat -c%s "$OUT_DIR/korea-places-extra.pmtiles")
          echo "PLACES_BYTES=${PLACES_BYTES}" >> "$GITHUB_ENV"
          echo "places-extra size ${PLACES_BYTES} bytes"
          ls -lh "$OUT_DIR/korea-places-extra.pmtiles"
          if [ -f "$OUT_DIR/places-extra-summary.json" ]; then
            cat "$OUT_DIR/places-extra-summary.json"
          fi

      - name: Download Planetiler OpenMapTiles jar
        if: ${{ env.UPLOAD_ONLY != 'true' && env.ONLY_PLACES_EXTRA != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          curl -L --fail -o "$OUT_DIR/planetiler.jar" "$PLANETILER_JAR_URL"
          ls -lh "$OUT_DIR/planetiler.jar"

      # planetiler-openmaptiles v3.16 requires class file 65 → Java 21+
      - name: Set up Java 21
        if: ${{ env.UPLOAD_ONLY != 'true' && env.ONLY_PLACES_EXTRA != 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Print Java version
        if: ${{ env.UPLOAD_ONLY != 'true' && env.ONLY_PLACES_EXTRA != 'true' }}
        run: java -version

      - name: Build korea.pmtiles
        if: ${{ env.UPLOAD_ONLY != 'true' && env.ONLY_PLACES_EXTRA != 'true' }}
        id: build
        run: |
          set -euo pipefail
          START=$(date +%s)
          # GitHub-hosted runner ≈7GB RAM; leave headroom for OS + Planetiler off-heap.
          java -Xmx4g -jar "$OUT_DIR/planetiler.jar" \
            --osm-path="$OUT_DIR/south-korea-latest.osm.pbf" \
            --output="$OUT_DIR/korea.pmtiles" \
            --languages=default,ko \
            --download \
            --force
          END=$(date +%s)
          # GITHUB_ENV applies to *later* steps only — export for this step's python too.
          BUILD_SECONDS=$((END - START))
          PMTILES_BYTES=$(stat -c%s "$OUT_DIR/korea.pmtiles")
          export BUILD_SECONDS PMTILES_BYTES
          {
            echo "BUILD_SECONDS=${BUILD_SECONDS}"
            echo "PMTILES_BYTES=${PMTILES_BYTES}"
          } >> "$GITHUB_ENV"
          echo "Build finished in ${BUILD_SECONDS}s, size ${PMTILES_BYTES} bytes"
          ls -lh "$OUT_DIR/korea.pmtiles"
          python3 - <<'PY'
          import json, os
          out_dir = os.environ.get("OUT_DIR", "build/tiles")
          meta = {
              "build_seconds": int(os.environ.get("BUILD_SECONDS") or "0"),
              "bytes": int(os.environ.get("PMTILES_BYTES") or "0"),
              "schema": "openmaptiles",
              "languages": "default,ko",
          }
          path = os.path.join(out_dir, "build-meta.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(meta, f, separators=(",", ":"))
          print("build-meta.json written")
          PY

      - name: Save korea.pmtiles artifact (full build)
        if: ${{ env.UPLOAD_ONLY != 'true' && env.ONLY_PLACES_EXTRA != 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: korea-pmtiles
          path: |
            ${{ github.workspace }}/build/tiles/korea.pmtiles
            ${{ github.workspace }}/build/tiles/build-meta.json
            ${{ github.workspace }}/build/tiles/korea-places-extra.pmtiles
            ${{ github.workspace }}/build/tiles/places-extra-summary.json
          retention-days: 3
          if-no-files-found: error

      - name: Save places-extra artifact (only_places_extra)
        if: ${{ env.ONLY_PLACES_EXTRA == 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: korea-places-extra
          path: |
            ${{ github.workspace }}/build/tiles/korea-places-extra.pmtiles
            ${{ github.workspace }}/build/tiles/places-extra-summary.json
          retention-days: 3
          if-no-files-found: error

      - name: Download korea-pmtiles artifact from prior run
        if: ${{ env.UPLOAD_ONLY == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: korea-pmtiles
          path: ${{ github.workspace }}/build/tiles
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Load sizes from artifact meta
        if: ${{ env.UPLOAD_ONLY == 'true' }}
        run: |
          set -euo pipefail
          if [ ! -f "$OUT_DIR/korea.pmtiles" ]; then
            echo "korea.pmtiles missing after artifact download"
            exit 1
          fi
          PMTILES_BYTES=$(stat -c%s "$OUT_DIR/korea.pmtiles")
          if [ -f "$OUT_DIR/build-meta.json" ]; then
            BUILD_SECONDS=$(python3 -c 'import json; print(json.load(open("'"$OUT_DIR"'/build-meta.json")).get("build_seconds", 0) or 0)')
          else
            BUILD_SECONDS=0
          fi
          if [ -f "$OUT_DIR/korea-places-extra.pmtiles" ]; then
            PLACES_BYTES=$(stat -c%s "$OUT_DIR/korea-places-extra.pmtiles")
            echo "PLACES_BYTES=${PLACES_BYTES}" >> "$GITHUB_ENV"
          fi
          export BUILD_SECONDS PMTILES_BYTES
          {
            echo "PMTILES_BYTES=${PMTILES_BYTES}"
            echo "BUILD_SECONDS=${BUILD_SECONDS}"
          } >> "$GITHUB_ENV"
          ls -lh "$OUT_DIR/korea.pmtiles" || true
          ls -lh "$OUT_DIR/korea-places-extra.pmtiles" || true

      - name: Record file size in Summary (before upload)
        if: always()
        continue-on-error: true
        run: |
          set +e
          {
            echo "## Korea PMTiles (pre-upload)"
            if [ -n "${PMTILES_BYTES:-}" ]; then
              echo "- Size bytes: ${PMTILES_BYTES}"
              echo "- Size MiB: $((PMTILES_BYTES / 1024 / 1024))"
            elif [ -f "${OUT_DIR}/korea.pmtiles" ]; then
              B=$(stat -c%s "${OUT_DIR}/korea.pmtiles")
              echo "- Size bytes: ${B}"
              echo "- Size MiB: $((B / 1024 / 1024))"
            else
              echo "- Size: n/a (korea.pmtiles not present)"
            fi
            echo "- places-extra bytes: ${PLACES_BYTES:-n/a}"
            echo "- Build seconds: ${BUILD_SECONDS:-n/a}"
            if [ "${UPLOAD_ONLY:-false}" = "true" ]; then
              echo "- Mode: upload_only"
            elif [ "${ONLY_PLACES_EXTRA:-false}" = "true" ]; then
              echo "- Mode: only_places_extra"
            else
              echo "- Mode: build_and_upload"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload PMTiles via S3 multipart
        # Default success() — Summary uses continue-on-error so it cannot skip this step.
        run: |
          set -euo pipefail
          # Do not enable shell xtrace — secrets must never appear in logs.
          VERSION=$(date -u +%Y%m%d)
          FILE="korea-${VERSION}.pmtiles"
          SRC="${OUT_DIR}/korea.pmtiles"
          PLACES_SRC="${OUT_DIR}/korea-places-extra.pmtiles"
          export OBJECT_VERSIONED="$FILE"
          echo "OBJECT_VERSIONED=$FILE" >> "$GITHUB_ENV"

          s3_cp() {
            local src="$1"
            local key="$2"
            local ctype="$3"
            # Immutable Cache-Control so browser HTTP cache can serve Range warm hits
            # (objects previously uploaded as no-cache forced full re-download).
            aws s3 cp "$src" "s3://${BUCKET}/${key}" \
              --endpoint-url "$SUPABASE_S3_ENDPOINT" \
              --content-type "$ctype" \
              --cache-control "public, max-age=31536000, immutable" \
              --only-show-errors \
              --cli-read-timeout 0 \
              --cli-connect-timeout 60
          }

          if [ "${ONLY_PLACES_EXTRA}" = "true" ]; then
            if [ ! -f "$PLACES_SRC" ]; then
              echo "Missing $PLACES_SRC"
              exit 1
            fi
            if [ -z "${PLACES_BYTES:-}" ]; then
              PLACES_BYTES=$(stat -c%s "$PLACES_SRC")
              export PLACES_BYTES
              echo "PLACES_BYTES=${PLACES_BYTES}" >> "$GITHUB_ENV"
            fi

            upload_places_only() {
              echo "Uploading korea-places-extra.pmtiles only…"
              s3_cp "$PLACES_SRC" "korea-places-extra.pmtiles" "application/vnd.pmtiles"

              # Merge into existing latest.json (do not wipe korea pointer).
              aws s3 cp "s3://${BUCKET}/latest.json" "$OUT_DIR/latest.json.prev" \
                --endpoint-url "$SUPABASE_S3_ENDPOINT" \
                --only-show-errors || true
              PLACES_BYTES="$PLACES_BYTES" OUT_DIR="$OUT_DIR" python3 - <<'PY'
          import json, os, datetime
          out_dir = os.environ["OUT_DIR"]
          places = int(os.environ.get("PLACES_BYTES") or "0")
          prev_path = os.path.join(out_dir, "latest.json.prev")
          payload = {}
          if os.path.isfile(prev_path):
              try:
                  with open(prev_path, encoding="utf-8") as f:
                      payload = json.load(f)
              except Exception:
                  payload = {}
          if not isinstance(payload, dict):
              payload = {}
          payload["places_extra_file"] = "korea-places-extra.pmtiles"
          payload["places_extra_bytes"] = places
          payload["places_extra_built_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          path = os.path.join(out_dir, "latest.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f, separators=(",", ":"))
          print("latest.json merged (places_extra fields)")
          PY
              echo "Uploading latest.json…"
              s3_cp "$OUT_DIR/latest.json" "latest.json" "application/json"
            }

            attempt=1
            max_attempts=3
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Upload attempt ${attempt}/${max_attempts} (places-extra only)…"
              if upload_places_only; then
                echo "Upload complete: korea-places-extra.pmtiles bytes=${PLACES_BYTES}"
                exit 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Upload failed after ${max_attempts} attempts."
                exit 1
              fi
              sleep_s=$((attempt * 45))
              echo "Upload attempt ${attempt} failed; waiting ${sleep_s}s before retry…"
              sleep "$sleep_s"
              attempt=$((attempt + 1))
            done
          fi

          # Full / upload_only path: require korea.pmtiles
          if [ ! -f "$SRC" ]; then
            echo "Missing $SRC"
            exit 1
          fi

          if [ -z "${PMTILES_BYTES:-}" ]; then
            PMTILES_BYTES=$(stat -c%s "$SRC")
            export PMTILES_BYTES
            echo "PMTILES_BYTES=${PMTILES_BYTES}" >> "$GITHUB_ENV"
          fi
          export BUILD_SECONDS="${BUILD_SECONDS:-0}"
          export PMTILES_BYTES

          upload_all() {
            echo "Uploading versioned object key only (multipart)…"
            s3_cp "$SRC" "$FILE" "application/vnd.pmtiles"
            echo "Uploading korea-latest.pmtiles…"
            s3_cp "$SRC" "korea-latest.pmtiles" "application/vnd.pmtiles"

            if [ -f "$PLACES_SRC" ]; then
              echo "Uploading korea-places-extra.pmtiles…"
              s3_cp "$PLACES_SRC" "korea-places-extra.pmtiles" "application/vnd.pmtiles"
              if [ -z "${PLACES_BYTES:-}" ]; then
                PLACES_BYTES=$(stat -c%s "$PLACES_SRC")
                export PLACES_BYTES
                echo "PLACES_BYTES=${PLACES_BYTES}" >> "$GITHUB_ENV"
              fi
            else
              echo "korea-places-extra.pmtiles absent — skip places upload."
            fi

            python3 - <<'PY'
          import json, os, datetime
          out_dir = os.environ.get("OUT_DIR", "build/tiles")
          src = os.path.join(out_dir, "korea.pmtiles")
          bytes_val = os.environ.get("PMTILES_BYTES") or "0"
          if bytes_val in ("", "0") and os.path.isfile(src):
              bytes_val = str(os.path.getsize(src))
          places = os.environ.get("PLACES_BYTES") or "0"
          places_src = os.path.join(out_dir, "korea-places-extra.pmtiles")
          if (places in ("", "0")) and os.path.isfile(places_src):
              places = str(os.path.getsize(places_src))
          payload = {
              "file": os.environ.get("OBJECT_VERSIONED") or "korea-latest.pmtiles",
              "bytes": int(bytes_val or "0"),
              "places_extra_file": "korea-places-extra.pmtiles",
              "places_extra_bytes": int(places or "0"),
              "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "build_seconds": int(os.environ.get("BUILD_SECONDS") or "0"),
              "schema": "openmaptiles",
              "languages": "default,ko",
          }
          path = os.path.join(out_dir, "latest.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f, separators=(",", ":"))
          print("latest.json written (object key + sizes only)")
          PY

            echo "Uploading latest.json…"
            s3_cp "$OUT_DIR/latest.json" "latest.json" "application/json"
          }

          # Initial try + up to 2 retries (3 attempts total)
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Upload attempt ${attempt}/${max_attempts}…"
            if upload_all; then
              echo "Upload complete: object=${FILE} bytes=${PMTILES_BYTES} build_seconds=${BUILD_SECONDS:-0}"
              echo "Public HTTP path (host omitted): /storage/v1/object/public/${BUCKET}/${FILE}"
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Upload failed after ${max_attempts} attempts."
              exit 1
            fi
            sleep_s=$((attempt * 45))
            echo "Upload attempt ${attempt} failed; waiting ${sleep_s}s before retry…"
            sleep "$sleep_s"
            attempt=$((attempt + 1))
          done

      - name: Job summary (post-upload)
        if: always()
        continue-on-error: true
        run: |
          set +e
          {
            echo "## Korea PMTiles (post-upload)"
            echo "- Versioned object key: ${OBJECT_VERSIONED:-n/a}"
            echo "- Pointer keys: korea-latest.pmtiles, korea-places-extra.pmtiles, latest.json"
            echo "- Upload: AWS CLI S3 multipart 16MB×2 concurrent, adaptive retry (endpoint/keys not logged)"
            echo "- Artifact: korea-pmtiles (full) or korea-places-extra (only_places_extra); retention 3 days"
            echo "- Size bytes: ${PMTILES_BYTES:-n/a}"
            if [ -n "${PMTILES_BYTES:-}" ]; then
              echo "- Size MiB: $((PMTILES_BYTES / 1024 / 1024))"
            fi
            echo "- places-extra bytes: ${PLACES_BYTES:-n/a}"
            if [ -n "${PLACES_BYTES:-}" ]; then
              echo "- places-extra MiB: $((PLACES_BYTES / 1024 / 1024))"
            fi
            echo "- Build seconds: ${BUILD_SECONDS:-n/a}"
            echo "- ONLY_PLACES_EXTRA: ${ONLY_PLACES_EXTRA:-false}"
            echo "- UPLOAD_ONLY: ${UPLOAD_ONLY:-false}"
          } >> "$GITHUB_STEP_SUMMARY" || true
